# NOTE: no sprintf-js override — the advisory (GHSA-hp3w-g68c-fv3c) is patched in
# 1.1.4, which is not yet published (highest available is 1.1.3). The override
# `sprintf-js@<=1.1.3: ^1.1.4` is unsatisfiable and breaks install/audit, so it is
# replaced by an audit exception below. Restore the override and drop the exception
# once sprintf-js 1.1.4 is released.
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 DoS via unbounded precision specifiers.
    # Patched in 1.1.4 (unreleased). Remove this exception when 1.1.4 ships and
    # add `sprintf-js@<=1.1.3: ^1.1.4` back to overrides above.
    - GHSA-hp3w-g68c-fv3c
